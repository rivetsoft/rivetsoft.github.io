<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Rivet Vice: a box squeezed in a vice -->
  <defs>
    <!-- a halftone screen, like old print, laid over the pieces at the back -->
    <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="3" cy="3" r="1.3" fill="#24121b" fill-opacity="0.35"/>
    </pattern>
  </defs>
  <!-- the hard shadow, offset down and right like the website's cards -->
  <g transform="translate(5 5)" fill="#24121b" stroke="#24121b" stroke-width="4" stroke-linejoin="round">
    <rect x="100" y="38" width="10" height="52" rx="3"/><rect x="14" y="20" width="24" height="88" rx="5"/><rect x="76" y="20" width="24" height="88" rx="5"/>
  </g>
  <g stroke="#24121b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <rect x="8" y="58" width="104" height="12" rx="3" fill="#24121b"/>
    <rect x="100" y="38" width="10" height="52" rx="3" fill="#006a93"/>
    <rect x="14" y="20" width="24" height="88" rx="5" fill="#0084b8"/>
    <rect x="76" y="20" width="24" height="88" rx="5" fill="#0084b8"/>
    <path d="M20 27v20M82 27v20" stroke="#40a3ca" stroke-width="4"/>
    <rect x="38" y="36" width="38" height="56" rx="2" fill="#d53f8c"/>
    <rect x="52" y="36" width="10" height="56" fill="#fff270"/>
  </g>
</svg>
