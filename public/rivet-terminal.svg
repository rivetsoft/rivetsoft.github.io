<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Rivet Terminal: a dark window with a green prompt and a yellow cursor -->
  <defs>
    <!-- a halftone screen, like old print, laid over the pieces at the back -->
    <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="3" cy="3" r="1.3" fill="#24121b" fill-opacity="0.35"/>
    </pattern>
  </defs>
  <!-- the hard shadow, offset down and right like the website's cards -->
  <g transform="translate(5 5)" fill="#24121b" stroke="#24121b" stroke-width="4" stroke-linejoin="round">
    <rect x="22" y="12" width="88" height="70" rx="10"/><rect x="12" y="24" width="96" height="86" rx="10"/>
  </g>
  <g stroke="#24121b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <rect x="22" y="12" width="88" height="70" rx="10" fill="#1f8f66"/>
    <rect x="22" y="12" width="88" height="70" rx="10" fill="url(#dots)" stroke="none"/>
    <rect x="12" y="24" width="96" height="86" rx="10" fill="#3ecf9a"/>
    <rect x="20" y="42" width="80" height="60" rx="4" fill="#24121b"/>
    <g stroke="none"><circle cx="24" cy="33" r="3.5" fill="#24121b"/><circle cx="35" cy="33" r="3.5" fill="#24121b"/></g>
    <path d="M32 58l13 11-13 11" fill="none" stroke="#3ecf9a" stroke-width="7"/>
    <rect x="52" y="78" width="26" height="8" fill="#fff270" stroke="none"/>
    <path d="M26 48h68" stroke="#3a2230" stroke-width="2"/>
  </g>
</svg>
