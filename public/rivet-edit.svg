<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Rivet Edit: a blue card of code with a cursor, another file open behind it -->
  <defs>
    <!-- a halftone screen, like old print, laid over the pieces at the back -->
    <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="3" cy="3" r="1.3" fill="#24121b" fill-opacity="0.35"/>
    </pattern>
  </defs>
  <!-- the hard shadow, offset down and right like the website's cards -->
  <g transform="translate(5 5)" fill="#24121b" stroke="#24121b" stroke-width="4" stroke-linejoin="round">
    <rect x="22" y="12" width="88" height="80" rx="10"/><rect x="12" y="24" width="96" height="86" rx="10"/>
  </g>
  <g stroke="#24121b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <rect x="22" y="12" width="88" height="80" rx="10" fill="#006a93"/>
    <rect x="22" y="12" width="88" height="80" rx="10" fill="url(#dots)" stroke="none"/>
    <rect x="12" y="24" width="96" height="86" rx="10" fill="#0084b8"/>
    <path d="M18 31h84" stroke="#40a3ca" stroke-width="4"/>
    <g stroke="none">
      <rect x="26" y="44" width="34" height="9" rx="2" fill="#ffffff"/><rect x="66" y="44" width="20" height="9" rx="2" fill="#fff270"/>
      <rect x="38" y="62" width="26" height="9" rx="2" fill="#9ad7ef"/>
      <rect x="38" y="80" width="40" height="9" rx="2" fill="#ffffff"/><rect x="84" y="80" width="10" height="9" rx="2" fill="#f4b7d2"/>
    </g>
    <rect x="70" y="58" width="8" height="18" fill="#fff270" stroke-width="3"/>
  </g>
</svg>
