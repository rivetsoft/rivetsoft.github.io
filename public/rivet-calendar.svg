<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Rivet Calendar: a page of days with one marked -->
  <defs>
    <!-- a halftone screen, like old print, laid over the pieces at the back -->
    <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="3" cy="3" r="1.3" fill="#24121b" fill-opacity="0.35"/>
    </pattern>
  </defs>
  <!-- the hard shadow, offset down and right like the website's cards -->
  <g transform="translate(5 5)" fill="#24121b" stroke="#24121b" stroke-width="4" stroke-linejoin="round">
    <rect x="12" y="18" width="96" height="92" rx="8"/>
  </g>
  <g stroke="#24121b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <rect x="12" y="18" width="96" height="92" rx="8" fill="#f7eef3"/>
    <path d="M12 26a8 8 0 0 1 8-8h80a8 8 0 0 1 8 8v20H12z" fill="#d53f8c"/>
    <path d="M18 26h84" stroke="#e07aab" stroke-width="4"/>
    <g fill="#9ad7ef" stroke="none"><rect x="26" y="60" width="12" height="10" rx="2"/><rect x="44" y="60" width="12" height="10" rx="2"/><rect x="80" y="60" width="12" height="10" rx="2"/><rect x="26" y="78" width="12" height="10" rx="2"/><rect x="44" y="78" width="12" height="10" rx="2"/><rect x="62" y="78" width="12" height="10" rx="2"/><rect x="80" y="78" width="12" height="10" rx="2"/><rect x="26" y="96" width="12" height="6" rx="2"/><rect x="44" y="96" width="12" height="6" rx="2"/></g>
    <rect x="59" y="56" width="18" height="18" rx="3" fill="#fff270" stroke-width="3"/>
    <rect x="34" y="8" width="8" height="18" rx="3" fill="#0084b8" stroke-width="3"/>
    <rect x="78" y="8" width="8" height="18" rx="3" fill="#0084b8" stroke-width="3"/>
  </g>
</svg>
