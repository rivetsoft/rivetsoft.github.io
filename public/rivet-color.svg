      <circle cx="3" cy="3" r="1.3" fill="#24121b" fill-opacity="0.35"/>
    </pattern>
  </defs>
  <!-- the hard shadow, offset down and right like the website's cards -->
  <g transform="translate(5 5)" fill="#24121b" stroke="#24121b" stroke-width="4" stroke-linejoin="round">
    <path d="M60 22C30 22 10 42 10 68c0 26 20 44 44 44 12 0 14-9 10-16-4-8 2-15 12-14 18 2 34-6 34-24 0-22-22-36-50-36z"/>
    <g transform="translate(88 40) rotate(45)"><rect x="-9" y="-32" width="18" height="24" rx="9"/><rect x="-7" y="-6" width="14" height="44"/></g>
  </g>
  <g stroke="#24121b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M60 22C30 22 10 42 10 68c0 26 20 44 44 44 12 0 14-9 10-16-4-8 2-15 12-14 18 2 34-6 34-24 0-22-22-36-50-36z" fill="#f7eef3"/>
    <path d="M60 22C30 22 10 42 10 68c0 26 20 44 44 44 12 0 14-9 10-16-4-8 2-15 12-14 18 2 34-6 34-24 0-22-22-36-50-36z" fill="url(#dots)" stroke="none" opacity="0.5"/>
    <path d="M22 60c2-14 14-26 30-28" fill="none" stroke="#ffffff" stroke-width="5"/>
    <circle cx="34" cy="78" r="9" fill="#d53f8c"/>
    <circle cx="40" cy="52" r="9" fill="#fff270"/>
    <circle cx="64" cy="42" r="8" fill="#3ecf9a"/>
    <circle cx="44" cy="98" r="7" fill="#0084b8"/>
    <g transform="translate(88 40) rotate(45)">
      <rect x="-7" y="-6" width="14" height="44" fill="#9ad7ef"/>
      <rect x="-7" y="18" width="14" height="20" fill="#d53f8c"/>
      <path d="M-7 38L0 52L7 38z" fill="#d53f8c"/>
      <rect x="-11" y="-10" width="22" height="8" rx="2" fill="#24121b"/>
      <rect x="-9" y="-34" width="18" height="24" rx="9" fill="#0084b8"/>
      <path d="M-3 -28v10" stroke="#40a3ca" stroke-width="4"/>
    </g>
