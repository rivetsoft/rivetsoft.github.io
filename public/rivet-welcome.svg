<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Rivet Welcome: the box the apps come in, with an arrow going in -->
  <defs>
    <!-- a halftone screen, like old print, laid over the pieces at the back -->
    <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="3" cy="3" r="1.3" fill="#24121b" fill-opacity="0.35"/>
    </pattern>
  </defs>
  <!-- the hard shadow, offset down and right like the website's cards -->
  <g transform="translate(5 5)" fill="#24121b" stroke="#24121b" stroke-width="4" stroke-linejoin="round">
    <rect x="20" y="12" width="80" height="40" rx="8"/><rect x="12" y="40" width="96" height="70" rx="8"/>
  </g>
  <g stroke="#24121b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <rect x="20" y="12" width="80" height="40" rx="8" fill="#006a93"/>
    <rect x="20" y="12" width="80" height="40" rx="8" fill="url(#dots)" stroke="none"/>
    <rect x="30" y="20" width="16" height="16" rx="3" fill="#d53f8c" stroke-width="3"/>
    <rect x="52" y="20" width="16" height="16" rx="3" fill="#fff270" stroke-width="3"/>
    <rect x="74" y="20" width="16" height="16" rx="3" fill="#3ecf9a" stroke-width="3"/>
    <rect x="12" y="40" width="96" height="70" rx="8" fill="#0084b8"/>
    <path d="M18 47h84" stroke="#40a3ca" stroke-width="4"/>
    <path d="M60 56v30M46 74l14 14 14-14" fill="none" stroke="#24121b" stroke-width="13"/>
    <path d="M60 56v30M46 74l14 14 14-14" fill="none" stroke="#fff270" stroke-width="6"/>
  </g>
</svg>
