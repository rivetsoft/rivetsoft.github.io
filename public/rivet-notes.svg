<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Rivet Notes: a yellow notepad with ruled lines and a tag -->
  <defs>
    <!-- a halftone screen, like old print, laid over the pieces at the back -->
    <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="3" cy="3" r="1.3" fill="#24121b" fill-opacity="0.35"/>
    </pattern>
  </defs>
  <!-- the hard shadow, offset down and right like the website's cards -->
  <g transform="translate(5 5)" fill="#24121b" stroke="#24121b" stroke-width="4" stroke-linejoin="round">
    <rect x="20" y="22" width="88" height="88" rx="8"/><rect x="12" y="18" width="88" height="90" rx="8"/>
  </g>
  <g stroke="#24121b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <rect x="20" y="22" width="88" height="88" rx="8" fill="#d9c840"/>
    <rect x="20" y="22" width="88" height="88" rx="8" fill="url(#dots)" stroke="none"/>
    <rect x="12" y="18" width="88" height="90" rx="8" fill="#fff270"/>
    <path d="M18 34h76" stroke="#fffbd0" stroke-width="4"/>
    <path d="M24 50h52M24 64h40M24 78h28" stroke="#d53f8c" stroke-width="5"/>
    <path d="M72 70l-4 26M84 70l-4 26M64 79h26M62 88h26" stroke-width="5" fill="none"/>
    <g fill="#e9dee5" stroke-width="3"><rect x="30" y="10" width="7" height="18" rx="3.5"/><rect x="48" y="10" width="7" height="18" rx="3.5"/><rect x="66" y="10" width="7" height="18" rx="3.5"/><rect x="84" y="10" width="7" height="18" rx="3.5"/></g>
  </g>
</svg>
