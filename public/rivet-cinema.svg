<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Rivet Cinema: a screen playing, with a sound wave beside the play mark -->
  <defs>
    <!-- a halftone screen, like old print, laid over the pieces at the back -->
    <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="3" cy="3" r="1.3" fill="#24121b" fill-opacity="0.35"/>
    </pattern>
  </defs>
  <!-- the hard shadow, offset down and right like the website's cards -->
  <g transform="translate(5 5)" fill="#24121b" stroke="#24121b" stroke-width="4" stroke-linejoin="round">
    <rect x="10" y="20" width="108" height="76" rx="9"/><rect x="44" y="96" width="40" height="14" rx="3"/>
  </g>
  <g stroke="#24121b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <rect x="44" y="94" width="40" height="14" rx="3" fill="#006a93"/>
    <rect x="44" y="94" width="40" height="14" rx="3" fill="url(#dots)"/>
    <rect x="10" y="20" width="108" height="76" rx="9" fill="#0084b8"/>
    <rect x="20" y="30" width="88" height="56" rx="4" fill="#24121b"/>
    <path d="M17 28v14" stroke="#40a3ca" stroke-width="4"/>
    <path d="M48 40 L78 58 L48 76 Z" fill="#d53f8c"/>
    <path d="M86 47 Q93 58 86 69" fill="none" stroke="#fff270" stroke-width="5"/>
    <path d="M95 41 Q106 58 95 75" fill="none" stroke="#fff270" stroke-width="5"/>
  </g>
</svg>
