<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5cc8ff"/>
      <stop offset="1" stop-color="#1f7fe0"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a63b8"/>
      <stop offset="1" stop-color="#14519a"/>
    </linearGradient>
    <linearGradient id="arrow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dcecfb"/>
    </linearGradient>
  </defs>

  <!-- folder back and tab (the same shape as Rivet's) -->
  <path d="M12 30a10 10 0 0 1 10-10h28.5a8 8 0 0 1 5.7 2.4L63 29.5h43a10 10 0 0 1 10 10V56H12z" fill="url(#back)"/>
  <!-- folder front -->
  <rect x="12" y="40" width="104" height="72" rx="12" fill="url(#front)"/>
  <rect x="12" y="40" width="104" height="6" rx="3" fill="#ffffff" fill-opacity="0.22"/>

  <!-- soft shadows under the arrows -->
  <ellipse cx="50" cy="101" rx="11" ry="2.6" fill="#0b3c75" fill-opacity="0.3"/>
  <ellipse cx="78" cy="101" rx="11" ry="2.6" fill="#0b3c75" fill-opacity="0.3"/>
  <!-- up arrow (upload) -->
  <path d="M50 54l15 16h-9v26h-12v-26h-9z" fill="url(#arrow)" stroke-linejoin="round"/>
  <!-- down arrow (download) -->
  <path d="M78 98l-15-16h9v-26h12v26h9z" fill="url(#arrow)" stroke-linejoin="round"/>
</svg>
