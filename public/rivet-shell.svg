<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Rivet Shell: a plum desktop with a sun, hills, a panel and a dock -->
  <defs>
    <!-- a halftone screen, like old print, laid over the pieces at the back -->
    <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="3" cy="3" r="1.3" fill="#24121b" fill-opacity="0.35"/>
    </pattern>
  </defs>
  <!-- the hard shadow, offset down and right like the website's cards -->
  <g transform="translate(5 5)" fill="#24121b" stroke="#24121b" stroke-width="4" stroke-linejoin="round">
    <rect x="10" y="12" width="100" height="98" rx="10"/>
  </g>
  <g stroke="#24121b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <rect x="10" y="12" width="100" height="98" rx="10" fill="#0084b8"/>
    <circle cx="82" cy="50" r="11" fill="#fff270"/>
    <path d="M10 82c20-14 36-16 52-7s30 7 48-5v30a10 10 0 0 1-10 10H20a10 10 0 0 1-10-10z" fill="#d53f8c"/>
    <path d="M10 12h100v14H10z" fill="#24121b" stroke="none"/>
    <rect x="10" y="12" width="100" height="98" rx="10" fill="none"/>
    <g stroke="none"><circle cx="20" cy="19" r="3" fill="#d53f8c"/><rect x="50" y="17" width="20" height="4" rx="2" fill="#3ecf9a"/><circle cx="100" cy="19" r="3" fill="#fff270"/></g>
    <rect x="32" y="90" width="56" height="14" rx="3" fill="#24121b"/>
    <g stroke="none"><rect x="37" y="93" width="8" height="8" rx="1" fill="#e07aab"/><rect x="49" y="93" width="8" height="8" rx="1" fill="#40a3ca"/><rect x="61" y="93" width="8" height="8" rx="1" fill="#fff270"/><rect x="73" y="93" width="8" height="8" rx="1" fill="#3ecf9a"/></g>
  </g>
</svg>
