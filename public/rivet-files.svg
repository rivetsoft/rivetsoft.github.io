<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Rivet Files: the pink folder with the rivet through it -->
  <defs>
    <!-- a halftone screen, like old print, laid over the pieces at the back -->
    <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="3" cy="3" r="1.3" fill="#24121b" fill-opacity="0.35"/>
    </pattern>
  </defs>
  <!-- the hard shadow, offset down and right like the website's cards -->
  <g transform="translate(5 5)" fill="#24121b" stroke="#24121b" stroke-width="4" stroke-linejoin="round">
    <path d="M12 28a8 8 0 0 1 8-8h28l8 8h44a8 8 0 0 1 8 8v24H12z"/><rect x="12" y="40" width="96" height="68" rx="8"/>
  </g>
  <g stroke="#24121b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <path d="M12 28a8 8 0 0 1 8-8h28l8 8h44a8 8 0 0 1 8 8v24H12z" fill="#992f64"/>
    <path d="M12 28a8 8 0 0 1 8-8h28l8 8h44a8 8 0 0 1 8 8v24H12z" fill="url(#dots)" stroke="none"/>

    <rect x="12" y="40" width="96" height="68" rx="8" fill="#d53f8c"/>
    <path d="M18 47h84" stroke="#e07aab" stroke-width="4"/>
    <g transform="rotate(-28 60 74)">
      <path d="M54 72h12v26l-6 6l-6-6z" fill="#e9dee5"/>
      <path d="M38 74a22 17 0 0 1 44 0z" fill="#ffffff"/>
      <path d="M36 74h48" stroke-width="5"/>
      <path d="M46 66a12 9 0 0 1 9-7" stroke="#f4b7d2" stroke-width="4" fill="none"/>
    </g>
    <path d="M96 13Q96 22 105 22Q96 22 96 31Q96 22 87 22Q96 22 96 13z" fill="#fff270" stroke-width="3"/>
  </g>
</svg>
